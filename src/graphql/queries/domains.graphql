# All domains for a service instance
query domains($environmentId: String!, $projectId: String!, $serviceId: String!) {
  domains(
    environmentId: $environmentId
    projectId: $projectId
    serviceId: $serviceId
  ) {
    __typename
    customDomains {
      id
      domain
      status {
        dnsRecords {
          requiredValue
          currentValue
          status
          hostlabel
          zone
        }
      }
    }
    serviceDomains {
      id
      domain
      suffix
      targetPort
      serviceId
      environmentId
    }
  }
}
